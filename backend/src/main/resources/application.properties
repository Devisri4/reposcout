spring.application.name=reposcout
server.port=${PORT:8080}

# Only the health endpoint is public (used by Render and the frontend's wake-up check).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Repo loader (step 2) ---
# Where repos are unpacked and cached. Other limits have defaults in RepoProperties.
reposcout.repo.work-dir=${REPOSCOUT_WORK_DIR:${java.io.tmpdir}/reposcout}
# Optional: raises GitHub's API limit from 60 to 5000 calls/hour. Set as an environment variable, never here.
reposcout.repo.github-token=${GITHUB_TOKEN:}

# --- Agent (step 4) ---
# Local runs can keep keys in backend/.env (git-ignored), e.g. GROQ_API_KEY=gsk_...
spring.config.import=optional:file:.env[.properties]
reposcout.agent.api-key=${GROQ_API_KEY:not-set}
reposcout.agent.max-tool-calls=15

# Groq speaks the OpenAI API, so Spring AI's OpenAI client is pointed at it.
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:not-set}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=1024
# gpt-oss is a reasoning model; low effort keeps answers inside the free tokens-per-minute limit.
spring.ai.openai.chat.options.reasoning-effort=low
# Only chat is used; switch off the other OpenAI features.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# Groq free tier: 8000 tokens/minute. On a 429, wait 5s, 10s, 20s... and try again (up to 6 attempts).
spring.ai.retry.max-attempts=6
# Treat 429 (rate limited) as "wait and retry", not as a permanent error.
spring.ai.retry.on-http-codes=429
spring.ai.retry.backoff.initial-interval=5s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=20s

# --- Frontend access (step 6) ---
# Pages allowed to call the API from a browser. Comma-separated; e.g. https://reposcout.vercel.app,https://*.vercel.app
reposcout.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
# The page also pings /actuator/health to wake the free server up.
management.endpoints.web.cors.allowed-origin-patterns=${FRONTEND_ORIGIN:http://localhost:5173}
management.endpoints.web.cors.allowed-methods=GET
